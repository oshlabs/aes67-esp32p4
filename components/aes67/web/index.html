<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AES67 Node</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#ccc;font:13px/1.5 'JetBrains Mono','Fira Code',Consolas,monospace}
a{color:#e8a030}
.wrap{max-width:1100px;margin:0 auto;padding:8px 12px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #333;margin-bottom:12px}
header h1{font-size:16px;color:#e8a030;font-weight:600}
header .meta{font-size:11px;color:#888;text-align:right}
.card{background:#1a1a1a;border:1px solid #282828;border-radius:4px;padding:10px 14px;margin-bottom:10px}
.card h2{font-size:12px;color:#e8a030;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:6px 18px}
.row span{white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:#222;border:1px solid #2a2a2a;border-radius:3px;padding:8px 10px;margin-bottom:6px;display:none}
.st .sn{color:#e8a030;font-weight:600;font-size:12px}
.st .si{font-size:11px;color:#999;margin-top:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dg{background:#4a4}.da{background:#e8a030}.dr{background:#c44}
.lbl{color:#666;font-size:11px}
.val{color:#ddd}
/* Numbers that update twice a second get fixed-width slots so the lines do
   not reflow as the digit count changes */
.row .val,.fv{display:inline-block;text-align:right;font-variant-numeric:tabular-nums}
#pg{min-width:23ch;text-align:left}#po,#pj{min-width:7ch}#py{min-width:8ch}#pf{min-width:6ch}
#pl{display:inline-block;min-width:8ch}
#fu{min-width:11ch}#fh{min-width:13ch}#fr{min-width:6ch}#ft{min-width:12ch}#fl{min-width:6ch}
#rl .re{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #222}
#rl .re:last-child{border:none}
.btn{background:#e8a030;color:#111;border:none;padding:3px 10px;border-radius:3px;font:11px/1.4 inherit;cursor:pointer}
.btn:hover{background:#f0b040}
.bd{background:#c44}.bd:hover{background:#d55}
.ms{display:flex;gap:8px;margin-top:6px;align-items:flex-start}
.ms textarea{flex:1;background:#222;border:1px solid #333;color:#ccc;padding:4px 8px;border-radius:3px;font:11px/1.4 inherit;resize:vertical;min-height:60px}
.ep{display:none;margin-top:6px;padding-top:6px;border-top:1px solid #333}
.ep input,.ep textarea{width:100%;background:#1a1a1a;border:1px solid #333;color:#ccc;padding:3px 6px;margin:2px 0 4px;font:11px inherit}
.ep textarea{min-height:50px;font-size:10px;line-height:1.3;resize:vertical}
.hdr{display:flex;justify-content:space-between;align-items:center}
footer{border-top:1px solid #333;padding:8px 0;font-size:11px;color:#666;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-top:8px}
#overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:99;justify-content:center;align-items:center}
#overlay.show{display:flex}
#overlay .box{background:#1a1a1a;border:1px solid #e8a030;border-radius:6px;padding:20px 30px;text-align:center;font-size:13px;color:#ccc}
#overlay .box .dot{width:10px;height:10px;margin:0 auto 10px}
.ctl{display:flex;align-items:center;gap:10px;padding:4px 0}
.ctl .lbl{width:140px}.ctl input[type=range]{flex:1;accent-color:#e8a030}.ctl .val{width:70px;text-align:right}
.tag{font-size:11px;padding:1px 7px;border-radius:3px;margin-left:8px;vertical-align:middle;font-weight:600;border:1px solid;background:transparent;letter-spacing:.5px}
.tag-gm{color:#e8a030;border-color:#e8a030}.tag-tr{color:#5c5;border-color:#5c5}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="overlay"><div class="box"><span class="dot da"></span><div id="ol-msg">Connecting...</div></div></div>
<div class="wrap">
<header>
<h1 id="devname">AES67 Node</h1>
<div class="meta"><span id="ver">--</span><br><span id="ip">--</span></div>
</header>
<div class="card">
<h2>PTP Status</h2>
<div class="row">
<span><span class="dot dr" id="pd"></span><span id="pl">--</span><span class="tag" id="pt" style="display:none" title=""></span></span>
<span><span class="lbl">GM </span><span class="val" id="pg">--</span></span>
<span><span class="lbl">Offset </span><span class="val" id="po">--</span><span class="lbl"> ns</span></span>
<span><span class="lbl">Jitter </span><span class="val" id="pj">--</span><span class="lbl"> ns</span></span>
<span><span class="lbl">Drift </span><span class="val" id="pf">--</span><span class="lbl"> ppm</span></span>
<span><span class="lbl">Delay </span><span class="val" id="py">--</span><span class="lbl"> ns</span></span>
</div>
</div>
<div class="card" id="ctlc" style="display:none"><h2>Controls</h2><div id="ctl"></div></div>
<div class="grid">
<div class="card"><h2>Sources (TX)</h2><div id="sc"></div></div>
<div class="card"><h2>Sinks (RX)</h2><div id="sk"></div></div>
</div>
<div class="card">
<h2>Network Discovery</h2>
<div id="rl"><span class="lbl">No remote sources discovered</span></div>
</div>
<div class="card">
<h2>Manual Subscribe</h2>
<div class="ms">
<textarea id="sdp" placeholder="Paste SDP text here&#10;v=0&#10;o=- ..."></textarea>
<button class="btn" id="msub">Subscribe</button>
</div>
</div>
<footer>
<span>Uptime: <span class="fv" id="fu">--</span></span>
<span>Heap: <span class="fv" id="fh">--</span></span>
<span>RTP: <span class="fv" id="fr">--</span> pps</span>
<span>Pkts: <span class="fv" id="ft">--</span></span>
<span>Lost: <span class="fv" id="fl">--</span></span>
</footer>
</div>
<script>
(function(){
"use strict";
var N=4,ws,rto,lRtp=0,lT=0,lastUp=null;
function g(id){return document.getElementById(id)}

/* Every piece of markup is built with DOM calls and every string from the
   device lands in textContent. Nothing from the network is parsed as HTML
   or as script, whatever a session name contains. */
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function btn(text,cls,onclick){var b=el("button","btn"+(cls?" "+cls:""),text);b.addEventListener("click",onclick);return b}

function fmt(n){return n!=null?Number(n).toLocaleString():"--"}
function fmtUp(s){
  if(s==null)return"--";
  var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),r=s%60,p=[];
  if(d)p.push(d+"d");p.push(h+"h");p.push(m+"m");p.push(r+"s");return p.join(" ");
}
function dc(l){return l==="locked"?"dg":l==="locking"||l==="acquiring"?"da":"dr"}
function fmtTime(us){
  if(!us)return"0";
  if(us>=1000000)return(us/1000000).toFixed(1)+"s";
  if(us>=1000){var ms=us/1000;return(ms%1?ms.toFixed(3).replace(/0+$/,''):ms.toFixed(0))+"ms"}
  return us+"µs";
}
function fc(s){return(s.codec||"?")+" / "+(s.sample_rate?fmt(s.sample_rate)+"Hz":"?")+" / "+(s.channels||"?")+"ch / "+fmtTime(s.ptime_us)}

/* State-changing calls carry a custom header (a CSRF guard: browsers do not
   send it cross-origin) and, when the device demands one, a bearer token
   asked for once and kept for this browser session. */
var token=null;
try{token=sessionStorage.getItem("aes67_token")}catch(x){}
function api(method,path,body){
  var o={method:method,headers:{"X-AES67-Request":"1"}};
  if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  if(token)o.headers["Authorization"]="Bearer "+token;
  return fetch(path,o).then(function(r){
    if(r.status===401){
      var t=prompt("This node requires a control token");
      if(t){token=t;try{sessionStorage.setItem("aes67_token",t)}catch(x){}return api(method,path,body)}
    }
    if(!r.ok)r.text().then(function(m){showOl(method+" "+path+" failed: "+m,true)});
    return r;
  });
}
function toggle(e){e.style.display=(!e.style.display||e.style.display==="none")?"block":"none"}

/* Stream slots are built once; status frames only update their text. */
var slots={src:[],sink:[]};
function mkSlots(container,prefix,isSink){
  var none=el("span","lbl",isSink?"No active sinks":"No active sources");
  none.id=prefix+"-none";container.appendChild(none);
  for(var i=0;i<N;i++)(function(i){
    var d=el("div","st"),hdr=el("div","hdr"),sn=el("span","sn"),dot=el("span","dot dr"),name=el("span",null,"--"),right=el("span");
    sn.appendChild(dot);sn.appendChild(name);hdr.appendChild(sn);hdr.appendChild(right);d.appendChild(hdr);
    var codec=el("div","si","--");d.appendChild(codec);
    var s={box:d,dot:dot,name:name,codec:codec};
    if(isSink){
      var stats=el("div","si");
      var rx=el("span",null,"--"),lost=el("span",null,"--"),jit=el("span",null,"--");
      stats.appendChild(document.createTextNode("RX: "));stats.appendChild(rx);
      stats.appendChild(document.createTextNode(" pkts | Lost: "));stats.appendChild(lost);
      stats.appendChild(document.createTextNode(" | Jitter: "));stats.appendChild(jit);
      stats.appendChild(document.createTextNode(" us"));d.appendChild(stats);
      var ep=el("div","ep"),nameIn=el("input"),sdpIn=el("textarea");
      sdpIn.placeholder="Paste SDP...";
      ep.appendChild(el("div","lbl","Name:"));ep.appendChild(nameIn);
      ep.appendChild(el("div","lbl","SDP (paste to re-subscribe):"));ep.appendChild(sdpIn);
      ep.appendChild(btn("Re-subscribe",null,function(){
        if(!sdpIn.value.trim()){showOl("Paste SDP text to re-subscribe",true);return}
        api("DELETE","/api/sinks/"+i).then(function(){return api("POST","/api/sinks",{name:nameIn.value||"Sink",sdp:sdpIn.value})});
      }));
      d.appendChild(ep);
      var eb=btn("edit",null,function(){toggle(ep)});eb.style.cssText="font-size:10px;padding:1px 6px;margin-right:4px";
      var xb=btn("x","bd",function(){api("DELETE","/api/sinks/"+i)});xb.style.cssText="font-size:10px;padding:1px 6px";
      right.appendChild(eb);right.appendChild(xb);
      s.rx=rx;s.lost=lost;s.jit=jit;s.ep=ep;s.nameIn=nameIn;
    }else{
      var tx=el("div","si");var txv=el("span",null,"--");
      tx.appendChild(document.createTextNode("TX: "));tx.appendChild(txv);tx.appendChild(document.createTextNode(" pkts"));d.appendChild(tx);
      var ip=el("div","ep");ip.appendChild(el("div","lbl","Source ID: "+i));d.appendChild(ip);
      var ib=btn("info",null,function(){toggle(ip)});ib.style.cssText="font-size:10px;padding:1px 6px";right.appendChild(ib);
      s.tx=txv;s.ep=ip;
    }
    container.appendChild(d);slots[prefix].push(s);
  })(i);
}

function updateSlots(prefix,arr){
  var ids={},i,any=false;
  if(arr)for(i=0;i<arr.length;i++)ids[arr[i].id]=arr[i];
  for(i=0;i<N;i++){
    var s=slots[prefix][i],data=ids[i];
    if(data){
      any=true;s.box.style.display="block";
      var on=prefix==="src"?true:data.receiving;
      s.dot.className="dot "+(on?"dg":"dr");
      s.name.textContent=data.name||"--";
      s.codec.textContent=fc(data);
      if(prefix==="src"){s.tx.textContent=fmt(data.packets_sent)}
      else{
        s.rx.textContent=fmt(data.packets_received);s.lost.textContent=fmt(data.packets_lost);s.jit.textContent=fmt(data.jitter_us);
        if(document.activeElement!==s.nameIn)s.nameIn.value=data.name||"";
      }
    }else{s.box.style.display="none";s.ep.style.display="none"}
  }
  g(prefix+"-none").style.display=any?"none":"";
}

function renderRemotes(arr){
  var c=g("rl");
  while(c.firstChild)c.removeChild(c.firstChild);
  if(!arr||!arr.length){c.appendChild(el("span","lbl","No remote sources discovered"));return}
  arr.forEach(function(r){
    var row=el("div","re"),left=el("span");
    left.appendChild(document.createTextNode(r.name+" "));
    left.appendChild(el("span","lbl","("+r.origin+")"));
    if(r.codec){left.appendChild(document.createTextNode(" "));left.appendChild(el("span","lbl",fc(r)))}
    row.appendChild(left);
    row.appendChild(btn("Subscribe",null,function(){api("POST","/api/sinks",{name:r.name,origin:r.origin})}));
    c.appendChild(row);
  });
}

/* Controls: one slider per registered control, built when first seen.
   A slider being dragged is not overwritten by status frames; its value is
   sent (debounced) and the device's answer is shown. */
var ctls={};
function mkControl(c){
  var row=el("div","ctl"),lbl=el("span","lbl",c.label),inp=el("input"),val=el("span","val");
  inp.type="range";inp.min=c.min;inp.max=c.max;inp.step=c.step;inp.value=c.value;
  var o={row:row,inp:inp,val:val,unit:c.unit||"",busy:false,timer:null};
  function show(x){val.textContent=x+(o.unit?" "+o.unit:"")}
  show(c.value);
  inp.addEventListener("input",function(){o.busy=true;show(inp.value);
    clearTimeout(o.timer);o.timer=setTimeout(function(){
      api("POST","/api/controls/"+c.name,{value:Number(inp.value)}).then(function(r){return r.ok?r.json():null})
        .then(function(d){if(d)show(d.value)}).finally(function(){o.busy=false});
    },150);
  });
  row.appendChild(lbl);row.appendChild(inp);row.appendChild(val);
  g("ctl").appendChild(row);ctls[c.name]=o;
}
function updateControls(arr){
  if(!arr||!arr.length){g("ctlc").style.display="none";return}
  g("ctlc").style.display="";
  arr.forEach(function(c){
    var o=ctls[c.name];
    if(!o){mkControl(c);return}
    if(!o.busy&&document.activeElement!==o.inp){o.inp.value=c.value;o.val.textContent=c.value+(o.unit?" "+o.unit:"")}
  });
}

function onMsg(e){
  var d;
  try{d=JSON.parse(e.data)}catch(x){showOl("Bad status frame from device",true);return}
  if(d.t!=="status")return;
  hideOl();
  var p=d.ptp||{};
  g("pd").className="dot "+dc(p.lock_state);
  g("pl").textContent=p.lock_state||"Unknown";
  g("pg").textContent=p.grandmaster||"--";
  var pt=g("pt");
  if(p.is_gm){pt.textContent="GM";pt.title="grandmaster (timeTransmitter)";pt.className="tag tag-gm";pt.style.display=""}
  else if(p.lock_state==="locked"||p.lock_state==="locking"){
    var tr=p.transport==="l2"?"L2":p.transport==="udp"?"UDP":"";
    pt.textContent="TR"+(tr?" \u00b7 "+tr:"");pt.title="timeReceiver"+(tr?" via "+tr+(tr==="L2"?" (hardware timestamps)":""):"");
    pt.className="tag tag-tr";pt.style.display=""}
  else{pt.style.display="none"}
  g("po").textContent=fmt(p.offset_ns);
  g("pj").textContent=fmt(p.jitter_ns);
  g("pf").textContent=p.drift_ppb!=null?(p.drift_ppb/1000).toFixed(2):"--";
  g("py").textContent=fmt(p.path_delay_ns);
  updateSlots("src",d.sources);
  updateSlots("sink",d.sinks);
  renderRemotes(d.sap_remotes);
  updateControls(d.controls);
  if(lastUp!=null&&d.uptime!=null&&d.uptime<lastUp-1){location.reload();return}
  lastUp=d.uptime;
  g("fu").textContent=fmtUp(d.uptime);
  g("fh").textContent=fmt(d.heap_free)+" B"+(d.truncated?" (status truncated)":"");
  var eth=d.eth||{},now=Date.now();
  if(lT>0&&eth.rtp!=null){var dt=(now-lT)/1000;if(dt>0.1)g("fr").textContent=fmt(Math.round((eth.rtp-lRtp)/dt))}
  lRtp=eth.rtp||0;lT=now;
  g("ft").textContent=fmt(eth.total);
  g("fl").textContent=fmt(eth.lost);
}

var backoff=1000,olErr=false;
function showOl(msg,isErr){var o=g("overlay");o.classList.add("show");g("ol-msg").textContent=msg;olErr=!!isErr}
function hideOl(){g("overlay").classList.remove("show");olErr=false}

function wsConn(){
  showOl("Connecting...");
  var l=location;
  ws=new WebSocket((l.protocol==="https:"?"wss://":"ws://")+l.host+"/ws");
  ws.onopen=function(){backoff=1000;showOl("Waiting for status...")};
  ws.onmessage=onMsg;
  ws.onclose=function(){
    var sec=Math.round(backoff/1000);
    showOl("Disconnected. Retrying in "+sec+"s...");
    rto=setTimeout(wsConn,backoff);
    backoff=Math.min(backoff*1.5,10000);
  };
  ws.onerror=function(){ws.close()};
}

function init(){
  mkSlots(g("sc"),"src",false);
  mkSlots(g("sk"),"sink",true);
  g("msub").addEventListener("click",function(){
    var v=g("sdp").value.trim();if(!v)return;
    api("POST","/api/sinks",{name:"Manual",sdp:v}).then(function(r){if(r.ok)g("sdp").value=""});
  });
  g("overlay").addEventListener("click",function(){if(olErr)hideOl()});
  fetch("/api/info").then(function(r){return r.json()}).then(function(d){
    if(d.name)g("devname").textContent=d.name;
    if(d.version)g("ver").textContent="v"+d.version;
    if(d.ip)g("ip").textContent=d.ip;
  }).catch(function(){});
  wsConn();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
})();
</script>
</body>
</html>
